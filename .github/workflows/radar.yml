name: radar
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC: BirdCast posts a UTC day's file about 01:05 UTC the next day, so by now last night is complete
  workflow_dispatch:
    inputs:
      nights:
        description: "How many nights to build, newest first"
        default: "10"
permissions:
  contents: write   # pushes the radar-data branch
  actions: write    # starts the Pages deploy afterwards
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Restore the last published file (older nights are kept, only new ones are fetched)
        run: git fetch --depth=1 origin radar-data 2>/dev/null && git show FETCH_HEAD:nightly.json > prev.json || echo "no earlier file"
      - name: Build nightly.json from BirdCast's public profiles
        env:
          NIGHTS: ${{ inputs.nights || '10' }}
        run: python3 fetch_birdcast.py --nights "$NIGHTS" --reuse prev.json --out nightly.json
      - name: Publish nightly.json on the radar-data branch
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('nightly.json'))
          ok = sum(1 for n in d['nights'].values() for r in n.values() if r['status'] == 'ok')
          print('ok site-nights:', ok)
          sys.exit(0 if ok >= 20 else 1)" || { echo "too little data, not publishing"; exit 1; }
          mkdir out && cp nightly.json out/ && cd out
          git init -q -b radar-data
          git config user.name "radar-bot" && git config user.email "radar-bot@users.noreply.github.com"
          git add nightly.json && git commit -q -m "nightly radar summary $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" radar-data
      - name: Start the Pages deploy so the new file goes live now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fronts.yml --ref main || true
